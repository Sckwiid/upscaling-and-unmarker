<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upscale + Unmarker | Batch frontend</title>
    <meta
      name="description"
      content="Upscale plusieurs images puis applique le pipeline Unmarker directement dans le navigateur. Telechargement image par image ou ZIP."
    />
    <meta
      name="keywords"
      content="image upscaler, unmarker, batch image processing, github pages, frontend image tool, canvas image processing"
    />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#000000" />
    <!-- Open Graph / Facebook -->
    <meta property="og:title" content="Upscale + Unmarker" />
    <meta
      property="og:description"
      content="Traitement batch 100% frontend: upscale local, pipeline unmarker, telechargement individuel ou ZIP."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Upscale + Unmarker" />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta
      property="og:image:alt"
      content="Upscale + Unmarker batch interface"
    />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Upscale + Unmarker"
    />
    <meta
      name="twitter:description"
      content="Upscale et unmarker plusieurs images directement dans le navigateur."
    />
    <meta name="twitter:image" content="%BASE_URL%og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Upscale + Unmarker batch interface"
    />
  </head>
  <body>
    <script>
      // Dark mode initialization - runs before React to avoid FOUC
      // Default to light mode unless explicitly set to dark
      (function () {
        const theme = localStorage.getItem("theme");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
